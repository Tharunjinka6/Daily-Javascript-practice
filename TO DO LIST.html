<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial;
        }

        input {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: gray;
        }
    </style>
</head>

<body>
    
    <h1>My To-Do List</h1>
    <input type="text" id="taskInput" placeholder="Enter a task" oninput="inputchange()"/>
    <button id="addTaskButton">Add</button>
    <ul class="task-list" id="tasklist">
    <!--Talk will be dynamically added here-->>
    </ul>

    <script src="To_do_list.js"></script>
</body>
</html>
